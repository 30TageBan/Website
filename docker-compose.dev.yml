services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chrisg
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env.development.local}
      POSTGRES_DB: chrisg
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - website-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chrisg -d chrisg']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  website-dev-postgres:
